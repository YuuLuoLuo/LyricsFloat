[package]
name = "lyric-board"
version = "0.2.0"
description = "桌面悬浮歌词板"
authors = ["YuLuo"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "lyric_board_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2.12", default-features = false, features = ["tls", "gzip"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_DirectWrite",
    "Win32_UI_Shell",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_Com",
    "Win32_System_SystemInformation",
    "Media_Control",
    "Foundation",
    "Foundation_Collections",
    "Storage_Streams",
] }

[features]
# 生产构建必须带上：tauri crate 编译时不启用 custom-protocol 就会走 devUrl
# （连本地开发服务器）。`tauri build` CLI 会自动开，裸 cargo build --release 要手动 --features custom-protocol。
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
